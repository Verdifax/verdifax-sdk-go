# Continuous-integration for verdifax-sdk-go.
#
# Runs on every PR and every push to main:
#   - go vet ./...           : compile-time correctness
#   - go test -race ./...    : every unit test, with race detection
#
# Test runtime is < 30 seconds, the SDK's test surface is the
# httptest-mocked orchestrator + a few pure-function helpers. The
# matrix runs every Go release still supported, the oldest being the
# go.mod minimum. The release workflow calls this workflow and
# releases only if every version passes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...
