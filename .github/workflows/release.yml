# Release workflow for verdifax-sdk-go.
#
# Triggered by a `v*` git tag push. Runs the CI workflow, the full
# test suite on every supported Go release, then publishes a GitHub
# Release only if it passes.
#
# Go modules don't need a registry push, `go get` resolves tags
# directly from GitHub. So a "release" for a Go module is really
# "tag a commit + announce it."
#
# To cut a new release:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# A few minutes later the release lands at:
#
#   https://github.com/Verdifax/verdifax-sdk-go/releases/tag/v0.2.0
#
# Consumers update via:
#
#   go get github.com/Verdifax/verdifax-sdk-go@v0.2.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # needed to create a GitHub release

jobs:
  # The full CI matrix; nothing is released unless it passes.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Pull the changelog block for this tag from CHANGELOG.md.
          # Falls back to "automated release" when no entry exists.
          tag="${GITHUB_REF##*/}"
          if [ -f CHANGELOG.md ] && awk -v t="## $tag" '
            $0 ~ "^"t" " { found=1; next }
            $0 ~ "^## v" && found { exit }
            found
          ' CHANGELOG.md > /tmp/notes.md && [ -s /tmp/notes.md ]; then
            echo "Found CHANGELOG block for $tag"
          else
            echo "Automated release of $tag." > /tmp/notes.md
          fi
          {
            echo "notes<<EOF"
            cat /tmp/notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
